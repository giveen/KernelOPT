name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release
      - name: Test
        # Unit + discovery tests. GPU/e2e tests are #[ignore] and real-repo
        # integration tests skip when NINFER_REPO / LLAMACPP_REPO are unset.
        run: cargo test

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install --upgrade pip pytest
      - name: Test runner parsers
        # CUDA/torch/build-dependent tests skip when the environment is absent.
        run: python -m pytest runner/tests -q
