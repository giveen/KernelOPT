[package]
name = "kernelopt"
version = "0.1.0"
edition = "2021"
description = "Dispatch-aware agentic GPU kernel optimization: Triton kernels in compiled PyTorch models, ninfer CUDA Ops, llama.cpp ggml-cuda kernels, and any CMake-based CUDA/HIP (ROCm) repo via kernelopt.toml"
license = "Apache-2.0"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"], default-features = false }
ctrlc = "3"
regex = "1"
libc = "0.2"
sha2 = "0.10"
base64 = "0.22"

[profile.release]
opt-level = 2
