[package]
name = "kernelopt"
version = "0.1.0"
edition = "2021"
description = "Dispatch-aware agentic GPU kernel optimization for compiled PyTorch models, ninfer CUDA Ops, and llama.cpp ggml-cuda kernels"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"], default-features = false }
ctrlc = "3"

[profile.release]
opt-level = 2
